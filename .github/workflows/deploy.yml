name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  production:
    name: Render backend + Vercel frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD_API_URL: ${{ secrets.PROD_API_URL }}
      PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          missing=0
          for name in RENDER_DEPLOY_HOOK_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PROD_API_URL PROD_FRONTEND_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Trigger Render backend deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for Render backend health
        run: |
          api_url="${PROD_API_URL%/}"
          api_root="${api_url%/api/v1}"
          echo "Waiting for $api_root/health"
          for i in {1..60}; do
            if curl -fsS "$api_root/health"; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not become healthy in time."
          exit 1

      - name: Run production API smoke test
        run: python scripts/smoke_test.py --api-url "$PROD_API_URL"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel production environment
        working-directory: frontend
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy Vercel production bundle
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Verify frontend production URL
        run: |
          frontend_url="${PROD_FRONTEND_URL%/}"
          echo "Waiting for $frontend_url"
          for i in {1..30}; do
            if curl -fsSL "$frontend_url" | grep -q "Graphify AI"; then
              echo "Frontend is live."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Frontend did not serve Graphify AI in time."
          exit 1
